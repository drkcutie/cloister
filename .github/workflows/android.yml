name: android
on:
  push:
  pull_request:
jobs:
  rules-fixtures:
    # Seam A for Kotlin: the rules engine runs every shared scenario in fixtures/rules on the JVM.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: ./gradlew :core:test --no-daemon
