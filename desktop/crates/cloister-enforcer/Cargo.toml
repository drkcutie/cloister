[package]
name = "cloister-enforcer"
description = "Cloister desktop enforcement service: DNS filter, firewall, hosts file, IPC."
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "cloister_enforcer"

[[bin]]
name = "cloisterd"
path = "src/bin/cloisterd.rs"

[dependencies]
chrono.workspace = true
cloister-core = { path = "../cloister-core" }
