[package]
name = "cloister-enforcer"
description = "Cloister desktop enforcement service: DNS filter, firewall, hosts file, IPC."
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "cloister_enforcer"

[[bin]]
name = "cloisterd"
path = "src/bin/cloisterd.rs"

[dependencies]
chrono.workspace = true
cloister-core = { path = "../cloister-core" }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The account fetch (account.rs): rustls everywhere but Windows, which uses SChannel.
[target.'cfg(not(windows))'.dependencies]
ureq = { version = "2", features = ["json"] }

[target.'cfg(windows)'.dependencies.ureq]
version = "2"
default-features = false
features = ["json", "native-tls"]

[target.'cfg(windows)'.dependencies]
native-tls = "0.2"
uds_windows = "1.1"
windows-service = "0.8"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Environment",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[dev-dependencies]
serde_json.workspace = true
tempfile = "3"
